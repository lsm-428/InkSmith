[project]
name = "inksmith"
version = "0.1.0"
description = "墨匠 InkSmith：膜层半色调——ED-FS 误差扩散引擎输出 one-pass 可打印位图（无 NN，PITFALLS #52）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy>=2.3.0",
    "pillow>=11.0.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch"}]
torchvision = [{index = "pytorch"}]
